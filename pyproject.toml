[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tefas-analiz"
version = "2.0.0"
description = "TEFAS fon analiz sistemi — temizlenmiş, tek-paket, test edilmiş sürüm"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "pyarrow>=14.0",   # parquet ara-çıktıları (CSV yerine: tipli, ~5-10x küçük, hızlı)
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tefas = "tefas.cli:main"

[tool.setuptools.packages.find]
include = ["tefas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
